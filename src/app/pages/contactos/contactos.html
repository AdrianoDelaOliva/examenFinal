<h1>Contáctanos para darte mas información</h1>

<form action="">
    <legend>Datos personales</legend>

        
        <label for="nombre">Nombre Completo</label>
        <input class="input" type="text" placeholder="Ingrese su nombre" id="nombre">
        
        <label for="email">Correo Electrónico</label>
        <input class="input" type="email" placeholder="Ingrese su correo" id="email">
        
        <label for="fecha">Fecha de entrega</label>
        <input class="input" type="date" id="fecha">
        
        <label for="file">Adjunte Documento</label>
        <input type="file" name="" id="file">
        
        <label for="marca">Marca de auto</label>
        <select name="" id="marca">
            <option value="" selected disabled>-- Seleccione --</option>
            <option value="">Toyota</option>
            <option value="">Nissan</option>
            <option value="">Tesla</option>
        </select>

        <label for="modelo">Modelo de auto</label>
        <select name="" id="modelo">
            <option value="" selected disabled>-- Seleccione --</option>
            <option value="">2018</option>
            <option value="">2024</option>
            <option value="">2026</option>
        </select>
        
        <label for="">Comentarios</label>
        <textarea name="" id="" placeholder="Mensaje"></textarea>
        <div class="botones">
            <input class="boton enviar" type="submit">
            <input class="boton cancelar" type="submit" value="Cancelar">
        </div>
</form>
